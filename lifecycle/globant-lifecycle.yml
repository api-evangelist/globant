  current_release: '2026-06'
  current_release_date: '2026-08-19'
  releases_notes: 'https://docs.globant.ai/en/wiki?31,Glob.AI+OS+Releases+Notes'
support_policy:
  window: 'One year from release date'
  statement: 'Each version released for a given region reaches its Support Terminated date one year after its release date.'
  supported_at_check: 'Releases 2025-05 through 2026-06'
  end_of_life: 'All releases prior to 2025-05 have reached end of life and no longer receive support.'
  coverage:
    - 'Q&A assisted support'
    - 'Hotfixes to critical security issues'
  requires: 'An up-to-date contract that includes a support service'
