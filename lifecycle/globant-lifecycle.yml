provider: Globant
providerId: globant
description: >-
  Globant Enterprise AI (Glob.AI OS) publishes a real, dated lifecycle: every release is supported for
  exactly one year from its release date, with a published table of support-termination dates. What it
  does NOT publish is any runtime deprecation signalling — no Sunset or Deprecation response headers,
  no per-endpoint deprecation notices — and there is no public status page anywhere in the estate.
