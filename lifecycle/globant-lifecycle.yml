    - {level: 'Level 2', coverage: '8x5 first-response support, Monday to Friday (GMT-3) business hours', scope: 'Standard'}
  docs: 'https://docs.globant.ai/en/wiki?274,Glob.AI+OS+Support+and+Contact+Information'
  note: Response-time targets are stated as availability windows, not as numeric response-time commitments.
status_page:
  published: false
  url: null
  note: >-
    No status page was found. The support page names no status URL, and the only health surfaces are
    unauthenticated JSON health endpoints — https://glob.ai/api/v1/health and
    https://api.beta.glob.ai/api/v1/health (both 200 {"status":"ok","version":"0.1.0"}) — plus
    https://api.saia.ai/ which returns {"running":true,"timestamp":...,"version":"1.1.7601-qa-18.14-904"}.
    A health endpoint is not a status page: there is no incident history, no subscription and no
    component breakdown. The RFC 9727 api-catalog does register the health endpoint under "status".
