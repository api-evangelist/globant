deprecation:
  policy_published: true
  policy_url: 'https://docs.globant.ai/en/wiki?3154,Glob.AI+OS+Lifecycle'
  notice_period: 'One year, implied by the fixed support window; no separate advance-notice commitment is stated.'
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  api_level_deprecation:
    - operation: 'POST /v4/agents/{idOrName}/versions/{versionNumber}/deprecate'
      note: >-
        The platform gives CUSTOMERS a deprecation primitive for their own agent versions. This is a
        tenant-facing capability, not Globant deprecating its own API.
  note: >-
    Derived deprecated-operation detection was not possible: Globant publishes no OpenAPI for the
    Globant Enterprise AI surface, so there is no deprecated:true flag to read.
