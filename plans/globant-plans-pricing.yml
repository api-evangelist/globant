created: '2026-05-04'
modified: '2026-09-14'
reconciled: true
supersedes: >-
  The 2026-05-04 bulk-sweep artifact, which was written generated and said Globant had no self-service
  pricing surface at all. That is no longer true: Glob.AI ships a machine-readable catalogue endpoint.
tags:
  - Software
  - Digital Transformation
  - Artificial Intelligence
  - AI Pods
  - Consulting
description: >-
  Globant publishes a MACHINE-READABLE product catalogue at https://glob.ai/api/catalog and no
  published price. The endpoint is unauthenticated, is described by the provider's own OpenAPI
  (operationId getCatalog), and carries a real per-token pricing MODEL — price_per_unit_usd,
  unit_price_usd and a price_unit enum of price_per_100k_tokens / price_per_million_tokens. For an
  anonymous caller every one of the 26 offerings returned price_unit "" and a zero amount, which the
  provider's own agent skill instructs agents to read as "prices withheld from this audience — do not
  quote them". So the pricing STRUCTURE is public and the pricing NUMBERS are not.
pricing_model:
  name: Value-based subscription (supervised tokens)
  billing_unit: supervised tokens
  components:
    - {name: Minimum Usage Fee, cadence: monthly, description: 'Per the selected Plan; covers token consumption up to that amount at the applicable token price.'}
    - {name: Variable Fee, cadence: usage-based, description: 'Accrues on consumption beyond the Minimum Usage Fee.'}
  no_seats: true
  no_hourly: true
  source: 'https://glob.ai/llms-full.txt'
  note: >-
    Plans and applicable fees are displayed on the platform at purchase time; the detailed pricing page
    requires a signed-in session and https://glob.ai/robots.txt explicitly disallows /pricing and
    /en/pricing to crawlers.
plan_count: 0
plans: []
plans_note: >-
  Zero, deliberately. Globant names no tier, publishes no price point and offers no self-service
  checkout to an anonymous visitor. Padding this list with the 26 catalogue SKUs would misrepresent a
  product catalogue as a pricing table — the SKUs are recorded separately below, where they belong.
