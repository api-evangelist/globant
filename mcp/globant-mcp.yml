name: Glob.AI Hubs Orchestrator MCP Server
description: >-
  Globant publishes an MCP server card at https://glob.ai/.well-known/mcp/server-card.json describing
  an MCP server named "orchestrator" that exposes the Glob.AI Hubs Orchestrator API — projects, goals,
  plans, work items, runs, artifacts and inbox — to Claude Code, Globant CODA and other MCP-compatible
  agents. The card and the provider's own published agent skill both state plainly that this is a LOCAL
  STDIO server and that no hosted HTTP/SSE MCP endpoint exists today.
status: published
deployment:
  mode: local-stdio
  endpoint: null
  install: 'uv --directory /path/to/orchestrator-mcp-server run server.py'
  package: https://github.com/globai/glob-ai-hubs-composer/tree/main/orchestrator-mcp-server
  auth: api-key
  verified: probed
  transport: stdio
  env:
    ORCHESTRATOR_URL: 'the orchestrator API base URL, supplied by the Glob.AI console runner setup (card default http://localhost:8000; the hosted orchestrator answers at https://api.beta.glob.ai)'
    MCP_TOKEN: 'minted by a signed-in human in the Glob.AI console (https://aipods.glob.ai) from a project runner setup; there is no self-service or anonymous token issuance'
  notes:
    - >-
      SEARCH-ONLY finding. The card is served by the provider; the transport block is quoted verbatim
      from it and was not inferred from prose.
    - >-
      https://glob.ai/.well-known/agent-skills/orchestrator-mcp-setup/SKILL.md states: "The orchestrator
      MCP server is a local stdio server - there is no hosted HTTP/SSE MCP endpoint."
    - >-
      No tools/list introspection was attempted: a stdio server has no URL to POST to. The tool list
      below is the provider's own published catalogue from the card.
    - >-
      The card's homepage link (github.com/globai/glob-ai-hubs-composer) was not resolvable
      unauthenticated at probe time; the repository is presumably private. The card itself is public.
