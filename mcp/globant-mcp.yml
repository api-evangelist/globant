mcp_client_surface:
  note: >-
    Distinct from the above, two Globant products CONSUME MCP rather than serve it — Globant Enterprise
    AI imports external MCP and A2A tool servers through the GEAI Proxy
    (https://docs.globant.ai/en/wiki?1179,Importing+Tools+using+MCP+and+A2A+Servers), and the CODA CLI
    reads MCP servers from ~/.coda/mcp.json. Neither exposes an MCP endpoint of its own.
