description: >-
  Crosswalk between Globant's published MCP tool surface and its published REST surface. The headline
  finding is that they do not overlap at all: the 33 orchestrator MCP tools are bound to the Glob.AI
  Hubs Orchestrator API (api.beta.glob.ai), which publishes NO OpenAPI, while the only OpenAPI Globant
  publishes (glob.ai/openapi.json) describes the two unauthenticated endpoints of the marketing origin.
  Every MCP tool is therefore mcp_only and every REST operation is rest_only. Recorded rather than
  silently dropped, per the contract-divergence rule.
