    card: https://glob.ai/.well-known/mcp/server-card.json
    transport: stdio
    endpoint: null
    tools: 33
    gated: true
    gate: MCP_TOKEN minted by a signed-in human in the Glob.AI console; no self-service issuance.
  orchestrator_rest:
    base: https://api.beta.glob.ai
    openapi: null
    note: >-
      The API the MCP tools actually call. /api/v1/health returns 200; /api/v1/projects returns 401
      "Authentication required"; /openapi.json, /docs, /redoc and /swagger.json all return 404, so the
      FastAPI schema routes are disabled. No operationIds exist to bind to.
  graphql:
    endpoint: null
    note: No GraphQL surface found on any Globant host.
crosswalk: []
crosswalk_note: >-
  Empty by evidence, not by omission. Binding an MCP tool to a REST operationId requires a published
  contract for the backing API; api.beta.glob.ai publishes none, so every binding would be invented.
