provider: Globant
providerId: globant
api: Globant Enterprise AI (Glob.AI OS)
description: >-
  Globant Enterprise AI publishes a numeric error-code registry covering the whole platform API. It is
  NOT RFC 9457 problem+json: errors come back in a proprietary envelope carrying a numeric id and a
  human-readable description, with %n placeholders interpolated with the offending field or entity.
format: proprietary
rfc9457: false
envelope:
  content_type: application/json
  shape: |
    {
      "errors": {
        "id": <numeric code>,
        "description": "<human-readable explanation>"
      }
    }
  placeholder_convention: 'Descriptions may contain %1, %2 … which are substituted with the field or entity name.'
