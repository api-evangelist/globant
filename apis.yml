description: >-
  Globant is a NYSE-listed digital and cognitive transformation company that, through two distinct
  platforms, publishes a genuinely agent-facing API surface. Globant Enterprise AI (Glob.AI OS) — the
  platform that began life as GeneXus' SAIA and was renamed after Globant acquired GeneXus — documents
  26 API groups covering agents, agentic processes, RAG, corpora, tools, embeddings, guardrails and
  usage limits at api.saia.ai, with a Python SDK (PyGEAI), a geai CLI, a full numeric error registry and
  a dated one-year support window per release. Separately, Glob.AI, the AI-native delivery platform
  launched in August 2026, publishes an OpenAPI 3.1 description, an RFC 9727 api-catalog, an llms.txt,
  digest-pinned Agent Skills and an MCP server card at glob.ai. Globant also ships the CODA agentic
  coding CLI.
