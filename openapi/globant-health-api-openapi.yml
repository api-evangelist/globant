openapi: 3.2.0
info:
  title: Glob.AI public Health API
  version: 1.0.0
  description: The unauthenticated API surface of glob.ai. All other endpoints on this origin require a browser session — see /auth.md for how authentication works and what agent access exists today.
servers:
- url: https://glob.ai
tags:
- name: Health
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Platform API health
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  version:
                    type: string
                required:
                - status
      tags:
      - Health
