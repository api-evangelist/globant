description: >-
  Well-known probe across every Globant-controlled host in this record: the corporate domain
  (globant.com / www.globant.com), the Globant Enterprise AI documentation host (docs.globant.ai),
  the GEAI API host (api.saia.ai), the legacy gateway (api.globant.com), and the Glob.AI platform
  hosts (glob.ai, aipods.glob.ai, api.beta.glob.ai). Only glob.ai and aipods.glob.ai serve real
  discovery documents. Every 200 returning the Next.js single-page shell is recorded as a MISS, not
  a document.
notes:
  - >-
    glob.ai and aipods.glob.ai answer 200 with the Next.js application shell for every unmatched
    /.well-known/* path (security.txt, openid-configuration, oauth-authorization-server,
    ai-plugin.json, agent-card.json, agent.json). These are SPA catch-alls, not documents, and are
    recorded with status 200 and a miss note.
  - >-
    https://glob.ai/auth.md states explicitly that this origin is not an OAuth issuer and publishes
    no OIDC/OAuth discovery metadata, which corroborates the SPA-shell reading of those paths.
  - >-
    www.globant.com returns 403 from an Imperva/Incapsula edge for every path including /robots.txt.
    This is a bot challenge against our crawler, not evidence of absence.
  - >-
    Two non-standard well-known paths are served and were captured:
    /.well-known/mcp/server-card.json (saved to mcp/) and /.well-known/agent-skills/index.json
    (saved here and to skills/).
